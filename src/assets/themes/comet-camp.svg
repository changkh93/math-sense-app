<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020718"/>
      <stop offset="40%" stop-color="#081434"/>
      <stop offset="80%" stop-color="#0f2552"/>
      <stop offset="100%" stop-color="#07122b"/>
    </linearGradient>
    <linearGradient id="cometTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tentGlow" cx="20%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020718" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="observatoryGlow" cx="80%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020718" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#nightSky)"/>
  <rect width="1920" height="1080" fill="url(#tentGlow)"/>
  <rect width="1920" height="1080" fill="url(#observatoryGlow)"/>

  <!-- Spectacular Giant Comet in Sky (Top Right to Center) -->
  <g id="giantComet" filter="url(#glow)">
    <!-- Dust tail wide beam -->
    <polygon points="1740,40 1780,70 960,340 900,310" fill="url(#cometTail)" opacity="0.45"/>
    <!-- Ion tail sharp beam -->
    <line x1="1760" y1="50" x2="820" y2="360" stroke="#38bdf8" stroke-width="6" opacity="0.8"/>
    <line x1="1760" y1="50" x2="820" y2="360" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Comet Coma (Head) -->
    <circle cx="1760" cy="50" r="22" fill="#ffffff"/>
    <circle cx="1760" cy="50" r="45" fill="#38bdf8" opacity="0.5"/>
    <circle cx="1760" cy="50" r="80" fill="#0284c7" opacity="0.25"/>
  </g>

  <!-- Starfield & Constellation Grid -->
  <g opacity="0.7">
    <!-- Star Points -->
    <circle cx="240" cy="140" r="1.5" fill="#fff"/>
    <circle cx="340" cy="90" r="2" fill="#fef08a"/>
    <circle cx="480" cy="180" r="1.8" fill="#e0f2fe"/>
    <circle cx="620" cy="110" r="2.2" fill="#fff"/>
    <circle cx="780" cy="220" r="1.5" fill="#bae6fd"/>
    <circle cx="1140" cy="140" r="1.8" fill="#fef08a"/>
    <circle cx="1320" cy="90" r="2" fill="#fff"/>
    <circle cx="1460" cy="180" r="1.5" fill="#e0f2fe"/>
    
    <!-- Constellation Lines (Left: Orion/Big Dipper Style) -->
    <line x1="240" y1="140" x2="340" y2="90" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <line x1="340" y1="90" x2="480" y2="180" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <line x1="480" y1="180" x2="620" y2="110" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Distant Mountain Peaks -->
  <path d="M0,660 L240,540 L520,680 L840,520 L1120,640 L1480,480 L1780,620 L1920,560 L1920,1080 L0,1080 Z" fill="#060e22" opacity="0.85"/>
  <path d="M0,740 L380,620 L760,760 L1180,590 L1620,720 L1920,640 L1920,1080 L0,1080 Z" fill="#04091a"/>

  <!-- Left Side Cozy Exploration Camp Tent -->
  <g id="leftCamp">
    <!-- Transparent Geodesic Tent -->
    <polygon points="180,560 380,560 480,840 80,840" fill="#f59e0b" opacity="0.3" filter="url(#glow)"/>
    <polygon points="180,560 380,560 480,840 80,840" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
    <!-- Tent Struts -->
    <line x1="280" y1="560" x2="280" y2="840" stroke="#fbbf24" stroke-width="1.8" opacity="0.7"/>
    <line x1="180" y1="560" x2="480" y2="840" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
    <line x1="380" y1="560" x2="80" y2="840" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
    <!-- Tent Interior Camp Lantern Glow -->
    <circle cx="280" cy="700" r="20" fill="#fef08a" opacity="0.9" filter="url(#glow)"/>
    <circle cx="280" cy="700" r="60" fill="#f59e0b" opacity="0.4"/>

    <!-- Small Campfire Outdoor Beacon -->
    <g transform="translate(180, 860)" filter="url(#glow)">
      <polygon points="0,-25 15,10 -15,10" fill="#f97316"/>
      <polygon points="0,-15 8,10 -8,10" fill="#fef08a"/>
    </g>
  </g>

  <!-- Right Side Astronomical Observation Outpost -->
  <g id="rightObservatory">
    <!-- Radio Telescope Dish -->
    <g transform="translate(1620, 600)" opacity="0.9" filter="url(#glow)">
      <!-- Base Mount -->
      <polygon points="-15,120 15,120 8,240 -8,240" fill="#1e293b"/>
      <line x1="-30" y1="240" x2="30" y2="240" stroke="#38bdf8" stroke-width="3"/>
      <!-- Parabolic Dish Curve -->
      <path d="M-100,20 Q0,-60 100,20" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
      <line x1="0" y1="-20" x2="0" y2="-90" stroke="#00f3ff" stroke-width="2"/>
      <circle cx="0" cy="-90" r="6" fill="#38bdf8"/>
    </g>

    <!-- Star Observation Formulas HUD (Right) -->
    <g opacity="0.8" transform="translate(1420, 420)" filter="url(#glow)">
      <text x="0" y="0" fill="#38bdf8" font-family="sans-serif" font-size="17" font-weight="bold">v = H₀ · d (Hubble Law)</text>
      <text x="15" y="32" fill="#fed7aa" font-family="sans-serif" font-size="15">L = 4π R² σ T⁴</text>
      <text x="-10" y="68" fill="#7dd3fc" font-family="sans-serif" font-size="15">λ_max · T = 2.898 × 10⁻³ m·K</text>
    </g>
  </g>

  <!-- Camp Plateau Ground Surface -->
  <path d="M0,880 Q960,860 1920,890 L1920,1080 L0,1080 Z" fill="#030818"/>
  <ellipse cx="280" cy="950" rx="200" ry="16" fill="#f59e0b" opacity="0.14" filter="url(#glow)"/>
  <ellipse cx="1620" cy="950" rx="180" ry="15" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>
</svg>
