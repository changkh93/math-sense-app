<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Alpine Celestial Night Gradients -->
    <linearGradient id="cometSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020410"/>
      <stop offset="35%" stop-color="#06102a"/>
      <stop offset="70%" stop-color="#0c2048"/>
      <stop offset="90%" stop-color="#14346e"/>
      <stop offset="100%" stop-color="#07142c"/>
    </linearGradient>

    <!-- Mountain Ridge Gradients -->
    <linearGradient id="farMountainSnow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0c2452"/>
      <stop offset="100%" stop-color="#040e20"/>
    </linearGradient>
    <linearGradient id="nearMountainSnow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="30%" stop-color="#1e3a8a"/>
      <stop offset="70%" stop-color="#091838"/>
      <stop offset="100%" stop-color="#030816"/>
    </linearGradient>

    <!-- Comet Luminous Ion & Dust Tail -->
    <linearGradient id="cometDustBeam" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fed7aa"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cometIonBeam" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="campLanternGlow" cx="22%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020410" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="telescopeGlow" cx="82%" cy="62%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#020410" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glowHeavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Sky & Celestial Starfield -->
  <rect width="1920" height="1080" fill="url(#cometSkyGrad)"/>
  <rect width="1920" height="1080" fill="url(#campLanternGlow)"/>
  <rect width="1920" height="1080" fill="url(#telescopeGlow)"/>

  <!-- Starfield Layer -->
  <g opacity="0.8">
    <circle cx="180" cy="120" r="1.6" fill="#fff"/>
    <circle cx="340" cy="80" r="2.2" fill="#fef08a"/>
    <circle cx="520" cy="160" r="1.4" fill="#e0f2fe"/>
    <circle cx="680" cy="90" r="2" fill="#fff"/>
    <circle cx="860" cy="190" r="1.8" fill="#bae6fd"/>
    <circle cx="1080" cy="130" r="2.2" fill="#fef08a"/>
    <circle cx="1260" cy="70" r="1.5" fill="#fff"/>
    <circle cx="1420" cy="180" r="1.8" fill="#fed7aa"/>
    <circle cx="1580" cy="90" r="2.4" fill="#fff"/>
    <circle cx="1820" cy="150" r="1.6" fill="#e0f2fe"/>
  </g>

  <!-- Constellation Line Geometry -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.4" fill="none">
    <polyline points="180,120 340,80 520,160 680,90"/>
    <polyline points="1080,130 1260,70 1420,180 1580,90"/>
  </g>

  <!-- 2. Colossal Spectacular Great Comet (Top Right Across Sky) -->
  <g id="greatComet">
    <!-- Broad Dust Tail -->
    <polygon points="1780,40 1840,80 920,380 840,330" fill="url(#cometDustBeam)" opacity="0.75" filter="url(#glowHeavy)"/>
    <!-- Intense Ion Gas Tail -->
    <polygon points="1790,50 1820,70 760,420 720,390" fill="url(#cometIonBeam)" opacity="0.9" filter="url(#glowHeavy)"/>
    <!-- Central Bright Streak -->
    <line x1="1800" y1="60" x2="680" y2="440" stroke="#ffffff" stroke-width="4.5" filter="url(#glowSoft)"/>
    <line x1="1800" y1="60" x2="680" y2="440" stroke="#bae6fd" stroke-width="1.8"/>

    <!-- Comet Head (Nucleus & Coma Glow) -->
    <circle cx="1800" cy="60" r="90" fill="#0284c7" opacity="0.3" filter="url(#glowHeavy)"/>
    <circle cx="1800" cy="60" r="50" fill="#38bdf8" opacity="0.6" filter="url(#glowHeavy)"/>
    <circle cx="1800" cy="60" r="25" fill="#ffffff" filter="url(#glowSoft)"/>
  </g>

  <!-- 3. Majestic Alpine Mountain Peaks -->
  <!-- Distant Jagged Peaks -->
  <path d="M0,580 L220,440 L460,560 L780,400 L1080,540 L1380,380 L1680,520 L1920,420 L1920,850 L0,850 Z" fill="url(#farMountainSnow)"/>

  <!-- Near Snow-Capped Mountain Ridges -->
  <path d="M0,640 L320,490 L680,660 L1020,470 L1440,640 L1760,480 L1920,580 L1920,920 L0,920 Z" fill="url(#nearMountainSnow)"/>
  <!-- Mountain Snow Highlights -->
  <polygon points="320,490 280,550 360,550" fill="#e0f2fe" opacity="0.8"/>
  <polygon points="1020,470 970,540 1070,540" fill="#e0f2fe" opacity="0.8"/>
  <polygon points="1760,480 1710,550 1810,550" fill="#e0f2fe" opacity="0.8"/>

  <!-- 4. Left Cozy Geodesic Camp Domes & Lantern Light -->
  <g id="leftCampDomes">
    <!-- Main Illuminated Exploration Dome 1 -->
    <path d="M120,780 Q240,540 360,780 Z" fill="rgba(245, 158, 11, 0.45)" filter="url(#glowHeavy)"/>
    <path d="M120,780 Q240,540 360,780 Z" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.9"/>
    <!-- Dome Strut Lines -->
    <line x1="240" y1="540" x2="240" y2="780" stroke="#fde047" stroke-width="2" opacity="0.85"/>
    <line x1="120" y1="780" x2="330" y2="620" stroke="#fbbf24" stroke-width="1.8" opacity="0.75"/>
    <line x1="360" y1="780" x2="150" y2="620" stroke="#fbbf24" stroke-width="1.8" opacity="0.75"/>

    <!-- Warm Glowing Interior Light & Hearth -->
    <circle cx="240" cy="680" r="30" fill="#fef08a" opacity="0.95" filter="url(#glowHeavy)"/>
    <circle cx="240" cy="680" r="70" fill="#f59e0b" opacity="0.5"/>

    <!-- Secondary Dome 2 (Left Back) -->
    <path d="M40,780 Q120,600 200,780 Z" fill="rgba(217, 119, 6, 0.35)" filter="url(#glowSoft)"/>
    <path d="M40,780 Q120,600 200,780 Z" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>

    <!-- Outdoor Campfire Hearth & Telemetry Beacon -->
    <g transform="translate(420, 770)" filter="url(#glowHeavy)">
      <circle cx="0" cy="0" r="16" fill="#ea580c"/>
      <circle cx="0" cy="0" r="8" fill="#fef08a"/>
      <polygon points="0,-28 14,8 -14,8" fill="#f97316"/>
      <polygon points="0,-18 8,6 -8,6" fill="#fef08a"/>
    </g>
  </g>

  <!-- 5. Right Giant Astronomical Radio & Optical Telescope Station -->
  <g id="rightObservatory">
    <!-- Parabolic Radio Telescope Dish (Colossal) -->
    <g transform="translate(1620, 580)" opacity="0.95" filter="url(#glowSoft)">
      <!-- Base Structural Mount -->
      <polygon points="-24,140 24,140 12,280 -12,280" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <line x1="-50" y1="280" x2="50" y2="280" stroke="#38bdf8" stroke-width="4"/>

      <!-- Parabolic Dish Structure -->
      <path d="M-130,30 Q0,-80 130,30" fill="rgba(14, 165, 233, 0.25)" stroke="#38bdf8" stroke-width="4.5" filter="url(#glowHeavy)"/>
      <path d="M-130,30 Q0,-80 130,30" fill="none" stroke="#ffffff" stroke-width="1.8"/>

      <!-- Receiver Feed Horn -->
      <line x1="0" y1="-25" x2="0" y2="-120" stroke="#00f3ff" stroke-width="3"/>
      <circle cx="0" cy="-120" r="10" fill="#38bdf8" filter="url(#glowHeavy)"/>
      <circle cx="0" cy="-120" r="5" fill="#ffffff"/>
    </g>

    <!-- Star Telemetry Data HUD Matrix (Right) -->
    <g opacity="0.88" transform="translate(1380, 360)" filter="url(#glowSoft)">
      <rect x="0" y="0" width="260" height="110" fill="rgba(6, 16, 44, 0.85)" rx="10" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="16" y="28" fill="#7dd3fc" font-family="monospace" font-size="14" font-weight="bold">ORBITAL TELEMETRY // COMET-C1</text>
      <text x="16" y="58" fill="#fde047" font-family="monospace" font-size="15">v = H₀ · d (Hubble Constant)</text>
      <text x="16" y="88" fill="#e0f2fe" font-family="monospace" font-size="14">λ_max · T = 2.898 × 10⁻³ m·K</text>
    </g>
  </g>

  <!-- 6. Plateau Ground Base Floor & Promenade -->
  <path d="M0,820 Q960,780 1920,820 L1920,1080 L0,1080 Z" fill="#040816" opacity="0.95"/>
  <path d="M0,880 Q960,840 1920,880 L1920,1080 L0,1080 Z" fill="#02040b"/>

  <path d="M0,820 Q960,780 1920,820" stroke="#f59e0b" stroke-width="3.5" fill="none" opacity="0.85" filter="url(#glowSoft)"/>
  <path d="M0,880 Q960,840 1920,880" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.75" filter="url(#glowSoft)"/>

  <!-- Campfire Beacon Nodes across Ridge -->
  <g fill="#fde047" filter="url(#glowSoft)">
    <circle cx="280" cy="830" r="6"/>
    <circle cx="560" cy="805" r="6"/>
    <circle cx="960" cy="790" r="7" fill="#38bdf8"/>
    <circle cx="1360" cy="805" r="6"/>
    <circle cx="1640" cy="830" r="6"/>
  </g>
</svg>
