<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Deep Subterranean Cavern Gradients -->
    <linearGradient id="cavernBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02080d"/>
      <stop offset="35%" stop-color="#03161c"/>
      <stop offset="70%" stop-color="#04232b"/>
      <stop offset="90%" stop-color="#02141a"/>
      <stop offset="100%" stop-color="#01070a"/>
    </linearGradient>

    <!-- Crystal Crystal Lighting Gradients -->
    <linearGradient id="crystalShineCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="crystalShineTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="30%" stop-color="#2dd4bf"/>
      <stop offset="70%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="crystalShineEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="35%" stop-color="#34d399"/>
      <stop offset="75%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <radialGradient id="cavernCenterGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#03161c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#01070a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftPillarGlow" cx="15%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#0d9488" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#02080d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightPillarGlow" cx="85%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#02080d" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glowHeavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Background Base & Atmospheric Haze -->
  <rect width="1920" height="1080" fill="url(#cavernBaseGrad)"/>
  <rect width="1920" height="1080" fill="url(#cavernCenterGlow)"/>
  <rect width="1920" height="1080" fill="url(#leftPillarGlow)"/>
  <rect width="1920" height="1080" fill="url(#rightPillarGlow)"/>

  <!-- Celestial Skylight Opening (Center High) -->
  <g opacity="0.65">
    <ellipse cx="960" cy="180" rx="360" ry="120" fill="#00f3ff" opacity="0.15" filter="url(#glowHeavy)"/>
    <circle cx="820" cy="140" r="1.5" fill="#e0f2fe"/>
    <circle cx="940" cy="110" r="2.2" fill="#a7f3d0"/>
    <circle cx="1060" cy="160" r="1.8" fill="#bae6fd"/>
    <circle cx="900" cy="190" r="1.2" fill="#f0fdf4"/>
    <circle cx="1020" cy="210" r="1.6" fill="#e0f2fe"/>
  </g>

  <!-- Distant Underground Crystal Stalactites (Ceiling) -->
  <g fill="#05242c" stroke="#0d9488" stroke-width="1" opacity="0.8">
    <polygon points="380,0 410,0 395,180"/>
    <polygon points="560,0 600,0 580,240"/>
    <polygon points="760,0 800,0 780,160"/>
    <polygon points="1120,0 1160,0 1140,190"/>
    <polygon points="1320,0 1360,0 1340,260"/>
    <polygon points="1520,0 1550,0 1535,170"/>
  </g>

  <!-- 2. Left Colossal Crystal Formations & Pillars -->
  <g id="leftCrystals">
    <!-- Dark Cave Wall Silhouette (Left) -->
    <path d="M0,0 L420,0 Q320,320 380,560 Q260,780 440,940 L400,1080 L0,1080 Z" fill="#020d13" opacity="0.95"/>

    <!-- Giant Main Crystal 1 (Tall Turquoise) -->
    <polygon points="180,680 260,220 330,640 240,780" fill="url(#crystalShineTeal)" filter="url(#glowSoft)"/>
    <polygon points="260,220 310,280 330,640 260,680" fill="#a7f3d0" opacity="0.85"/>
    <polygon points="140,720 180,680 240,780 180,820" fill="#042f2e"/>

    <!-- Crystal Spire 2 (Cyan Cluster) -->
    <polygon points="280,720 380,360 440,760 340,840" fill="url(#crystalShineCyan)" filter="url(#glowHeavy)"/>
    <polygon points="380,360 430,420 440,760" fill="#e0f2fe" opacity="0.9"/>
    <polygon points="240,760 280,720 340,840 280,880" fill="#0c4a6e"/>

    <!-- Crystal Spire 3 (Emerald Low Spike) -->
    <polygon points="80,780 140,520 200,820 120,890" fill="url(#crystalShineEmerald)" filter="url(#glowSoft)"/>
    <polygon points="140,520 180,560 200,820" fill="#6ee7b7" opacity="0.85"/>

    <!-- Floating Luminous Formula Glyphs (Left) -->
    <g opacity="0.85" transform="translate(180, 440)" filter="url(#glowSoft)">
      <rect x="-10" y="-24" width="220" height="96" fill="rgba(2, 20, 26, 0.7)" rx="8" stroke="#2dd4bf" stroke-width="1.2"/>
      <text x="10" y="0" fill="#a7f3d0" font-family="monospace" font-size="16" font-weight="bold">∫ e^(-x²) dx = √π</text>
      <text x="10" y="30" fill="#38bdf8" font-family="monospace" font-size="15">∇ × E = -∂B/∂t</text>
      <text x="10" y="58" fill="#5eead4" font-family="monospace" font-size="15">ζ(s) = ∑ 1/nˢ</text>
    </g>

    <!-- Floating 3D Mathematical Polyhedron (Left) -->
    <g transform="translate(260, 260)" opacity="0.9" filter="url(#glowHeavy)">
      <polygon points="0,-45 42,-15 42,30 0,55 -42,30 -42,-15" fill="rgba(45, 212, 191, 0.25)" stroke="#00f3ff" stroke-width="2"/>
      <line x1="0" y1="-45" x2="42" y2="30" stroke="#a7f3d0" stroke-width="1.5"/>
      <line x1="0" y1="-45" x2="-42" y2="30" stroke="#a7f3d0" stroke-width="1.5"/>
      <line x1="-42" y1="-15" x2="42" y2="-15" stroke="#2dd4bf" stroke-width="1.5"/>
      <line x1="0" y1="55" x2="42" y2="-15" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="0" y1="55" x2="-42" y2="-15" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="0" cy="5" r="8" fill="#f0fdf4"/>
    </g>
  </g>

  <!-- 3. Right Colossal Crystal Formations & Pillars -->
  <g id="rightCrystals">
    <!-- Dark Cave Wall Silhouette (Right) -->
    <path d="M1920,0 L1500,0 Q1600,320 1540,560 Q1660,780 1480,940 L1520,1080 L1920,1080 Z" fill="#020d13" opacity="0.95"/>

    <!-- Giant Main Crystal 4 (Colossal Cyan Right) -->
    <polygon points="1640,680 1560,180 1480,640 1580,780" fill="url(#crystalShineCyan)" filter="url(#glowHeavy)"/>
    <polygon points="1560,180 1520,240 1480,640" fill="#e0f2fe" opacity="0.9"/>
    <polygon points="1700,720 1640,680 1580,780 1660,820" fill="#0c4a6e"/>

    <!-- Crystal Spire 5 (Teal Cluster) -->
    <polygon points="1540,720 1440,320 1380,760 1480,840" fill="url(#crystalShineTeal)" filter="url(#glowSoft)"/>
    <polygon points="1440,320 1400,380 1380,760" fill="#a7f3d0" opacity="0.9"/>
    <polygon points="1600,760 1540,720 1480,840 1560,880" fill="#042f2e"/>

    <!-- Crystal Spire 6 (Emerald Low Spike Right) -->
    <polygon points="1760,780 1700,480 1640,820 1720,890" fill="url(#crystalShineEmerald)" filter="url(#glowSoft)"/>
    <polygon points="1700,480 1660,530 1640,820" fill="#6ee7b7" opacity="0.85"/>

    <!-- Floating Luminous Formula Glyphs (Right) -->
    <g opacity="0.85" transform="translate(1480, 440)" filter="url(#glowSoft)">
      <rect x="-10" y="-24" width="220" height="96" fill="rgba(2, 20, 26, 0.7)" rx="8" stroke="#00f3ff" stroke-width="1.2"/>
      <text x="10" y="0" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">e^(iπ) + 1 = 0</text>
      <text x="10" y="30" fill="#5eead4" font-family="monospace" font-size="15">∑ 1/n² = π²/6</text>
      <text x="10" y="58" fill="#a7f3d0" font-family="monospace" font-size="15">H|ψ⟩ = E|ψ⟩</text>
    </g>

    <!-- Floating 3D Icosahedron/Dodecahedron Polyhedron (Right) -->
    <g transform="translate(1640, 260)" opacity="0.9" filter="url(#glowHeavy)">
      <polygon points="0,-42 38,-12 24,36 -24,36 -38,-12" fill="rgba(56, 189, 248, 0.25)" stroke="#2dd4bf" stroke-width="2"/>
      <polygon points="0,-22 20,-6 12,20 -12,20 -20,-6" fill="none" stroke="#a7f3d0" stroke-width="1.5"/>
      <line x1="0" y1="-42" x2="0" y2="-22" stroke="#00f3ff" stroke-width="1.5"/>
      <line x1="38" y1="-12" x2="20" y2="-6" stroke="#00f3ff" stroke-width="1.5"/>
      <line x1="24" y1="36" x2="12" y2="20" stroke="#00f3ff" stroke-width="1.5"/>
      <line x1="-24" y1="36" x2="-12" y2="20" stroke="#00f3ff" stroke-width="1.5"/>
      <line x1="-38" y1="-12" x2="-20" y2="-6" stroke="#00f3ff" stroke-width="1.5"/>
      <circle cx="0" cy="5" r="8" fill="#e0f2fe"/>
    </g>
  </g>

  <!-- 4. Subterranean Bioluminescent Lake (Floor) -->
  <path d="M0,860 Q480,820 960,840 Q1440,860 1920,830 L1920,1080 L0,1080 Z" fill="#011820" opacity="0.95"/>
  <path d="M0,910 Q480,880 960,890 Q1440,900 1920,880 L1920,1080 L0,1080 Z" fill="#010e14"/>

  <!-- Shimmering Teal/Cyan Water Surface Reflections -->
  <ellipse cx="280" cy="920" rx="220" ry="24" fill="#00f3ff" opacity="0.25" filter="url(#glowHeavy)"/>
  <ellipse cx="1580" cy="920" rx="240" ry="26" fill="#2dd4bf" opacity="0.25" filter="url(#glowHeavy)"/>
  <ellipse cx="960" cy="940" rx="420" ry="18" fill="#38bdf8" opacity="0.18" filter="url(#glowSoft)"/>

  <!-- Crystal Pathway Promenade Edges -->
  <path d="M0,860 Q480,820 960,840 Q1440,860 1920,830" stroke="#2dd4bf" stroke-width="3.5" fill="none" opacity="0.8" filter="url(#glowSoft)"/>
  <path d="M0,910 Q480,880 960,890 Q1440,900 1920,880" stroke="#00f3ff" stroke-width="2.5" fill="none" opacity="0.7" filter="url(#glowSoft)"/>

  <!-- Glowing Mineral Crystal Clusters on Water Edge -->
  <g fill="#2dd4bf" filter="url(#glowSoft)">
    <polygon points="420,860 435,820 445,865"/>
    <polygon points="445,865 455,830 465,868"/>
    <polygon points="940,850 955,815 970,855"/>
    <polygon points="1480,860 1495,825 1510,865"/>
    <polygon points="1510,865 1525,835 1535,868"/>
  </g>
</svg>
