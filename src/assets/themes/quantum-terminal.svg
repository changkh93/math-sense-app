<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="quantumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05081c"/>
      <stop offset="50%" stop-color="#0b102f"/>
      <stop offset="100%" stop-color="#040616"/>
    </linearGradient>
    <radialGradient id="cyberGlowL" cx="15%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05081c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyberGlowR" cx="85%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05081c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cyberGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#6366f1" stroke-width="0.75" opacity="0.15"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base & Cyber Grid -->
  <rect width="1920" height="1080" fill="url(#quantumBg)"/>
  <rect width="1920" height="1080" fill="url(#cyberGrid)"/>
  <rect width="1920" height="1080" fill="url(#cyberGlowL)"/>
  <rect width="1920" height="1080" fill="url(#cyberGlowR)"/>

  <!-- Background Laser Wave Guides -->
  <g opacity="0.3" stroke="#818cf8" stroke-width="1.5" fill="none">
    <path d="M0,280 C480,240 960,340 1920,260"/>
    <path d="M0,340 C480,380 960,260 1920,360" stroke="#ec4899"/>
    <path d="M0,780 C480,820 960,740 1920,800"/>
    <path d="M0,840 C480,760 960,860 1920,820" stroke="#a855f7"/>
  </g>

  <!-- Left Server Mainframe & Quantum Terminal Stack -->
  <g id="leftTerminal">
    <!-- Mainframe Pillar 1 -->
    <rect x="80" y="160" width="120" height="780" fill="#090d28" stroke="#4f46e5" stroke-width="1.5" rx="8"/>
    <rect x="95" y="200" width="90" height="20" fill="#1e1b4b"/>
    <rect x="95" y="240" width="90" height="20" fill="#1e1b4b"/>
    <rect x="95" y="280" width="90" height="20" fill="#1e1b4b"/>
    <circle cx="110" cy="210" r="4" fill="#4ade80" filter="url(#glow)"/>
    <circle cx="110" cy="250" r="4" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="110" cy="290" r="4" fill="#ec4899" filter="url(#glow)"/>

    <!-- Left HUD Matrix Interface -->
    <g transform="translate(230, 260)" opacity="0.85" filter="url(#glow)">
      <rect x="0" y="0" width="220" height="260" fill="rgba(15, 23, 42, 0.75)" stroke="#818cf8" stroke-width="1.5" rx="10"/>
      <line x1="0" y1="36" x2="220" y2="36" stroke="#818cf8" stroke-width="1"/>
      <text x="16" y="24" fill="#a5b4fc" font-family="monospace" font-size="13" font-weight="bold">QUANTUM_STATE // Q0</text>
      <text x="16" y="70" fill="#818cf8" font-family="monospace" font-size="14">|ψ⟩ = α|0⟩ + β|1⟩</text>
      <text x="16" y="105" fill="#c084fc" font-family="monospace" font-size="13">|α|² + |β|² = 1</text>
      <text x="16" y="140" fill="#e0e7ff" font-family="monospace" font-size="13">H = 1/√2 [1  1]</text>
      <text x="75" y="160" fill="#e0e7ff" font-family="monospace" font-size="13">[1 -1]</text>
      <text x="16" y="195" fill="#34d399" font-family="monospace" font-size="13">FIDELITY: 99.98%</text>
      <text x="16" y="230" fill="#38bdf8" font-family="monospace" font-size="13">ENTANGLED: TRUE</text>
    </g>

    <!-- Superconducting Quantum Processor Core Ring -->
    <g transform="translate(260, 680)" opacity="0.8" filter="url(#glow)">
      <circle cx="0" cy="0" r="60" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 4"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#ec4899" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#a5b4fc"/>
      <line x1="-70" y1="0" x2="70" y2="0" stroke="#818cf8" stroke-width="1.5"/>
      <line x1="0" y1="-70" x2="0" y2="70" stroke="#818cf8" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Right Server Mainframe & Wavefunction Terminal Stack -->
  <g id="rightTerminal">
    <!-- Mainframe Pillar 2 -->
    <rect x="1720" y="160" width="120" height="780" fill="#090d28" stroke="#9333ea" stroke-width="1.5" rx="8"/>
    <rect x="1735" y="200" width="90" height="20" fill="#1e1b4b"/>
    <rect x="1735" y="240" width="90" height="20" fill="#1e1b4b"/>
    <rect x="1735" y="280" width="90" height="20" fill="#1e1b4b"/>
    <circle cx="1750" cy="210" r="4" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="1750" cy="250" r="4" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="1750" cy="290" r="4" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Right HUD Matrix Interface -->
    <g transform="translate(1470, 260)" opacity="0.85" filter="url(#glow)">
      <rect x="0" y="0" width="220" height="260" fill="rgba(15, 23, 42, 0.75)" stroke="#ec4899" stroke-width="1.5" rx="10"/>
      <line x1="0" y1="36" x2="220" y2="36" stroke="#ec4899" stroke-width="1"/>
      <text x="16" y="24" fill="#f472b6" font-family="monospace" font-size="13" font-weight="bold">WAVEFUNCTION // SCHRÖDINGER</text>
      <text x="16" y="70" fill="#ec4899" font-family="monospace" font-size="14">iℏ ∂Ψ/∂t = ĤΨ</text>
      <text x="16" y="105" fill="#818cf8" font-family="monospace" font-size="13">Δx · Δp ≥ ℏ/2</text>
      <text x="16" y="140" fill="#a78bfa" font-family="monospace" font-size="13">CNOT |x, y⟩ = |x, x⊕y⟩</text>
      <text x="16" y="180" fill="#fbbf24" font-family="monospace" font-size="13">QUBITS: 1024</text>
      <text x="16" y="220" fill="#34d399" font-family="monospace" font-size="13">COHERENCE: OPTIMAL</text>
    </g>

    <!-- Right Qubit Bloch Sphere Simulation -->
    <g transform="translate(1600, 680)" opacity="0.85" filter="url(#glow)">
      <circle cx="0" cy="0" r="55" fill="none" stroke="#ec4899" stroke-width="1.8"/>
      <ellipse cx="0" cy="0" rx="55" ry="18" fill="none" stroke="#818cf8" stroke-dasharray="4 3" stroke-width="1.4"/>
      <line x1="0" y1="-65" x2="0" y2="65" stroke="#a5b4fc" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="35" y2="-35" stroke="#f472b6" stroke-width="2.2"/>
      <circle cx="35" cy="-35" r="5" fill="#f472b6"/>
      <text x="-6" y="-72" fill="#e0e7ff" font-family="monospace" font-size="12">|0⟩</text>
      <text x="-6" y="82" fill="#e0e7ff" font-family="monospace" font-size="12">|1⟩</text>
    </g>
  </g>

  <!-- Cyber Platform Floor Base -->
  <path d="M0,920 L1920,920 L1920,1080 L0,1080 Z" fill="#040718" opacity="0.95"/>
  <line x1="0" y1="920" x2="1920" y2="920" stroke="#6366f1" stroke-width="2" opacity="0.8"/>
  <ellipse cx="300" cy="980" rx="200" ry="16" fill="#818cf8" opacity="0.16" filter="url(#glow)"/>
  <ellipse cx="1620" cy="980" rx="200" ry="16" fill="#ec4899" opacity="0.14" filter="url(#glow)"/>
</svg>
