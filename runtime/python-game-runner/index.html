<script id="studio-console-policy">
// Pygbag 0.9 overwrites config.quiet and logs its bootstrap source/configuration.
// Limit filtering to this isolated runner and known routine messages. Python
// stdout/tracebacks use StudioOutput + MessagePort, not this browser console.
(()=>{
 let diagnostics=false;
 window.studioSetRuntimeDiagnostics=enabled=>{diagnostics=enabled===true;};
 const routineLogs=new Set([
  'script?','AUTOSTART','interpreter=','orig_argv','sys.argv: ',
  'docurl=','srcurl=','data-os=','data-python=','script: id=','code : ',
  'PyMain: running in main thread, faking onCustomMessage',
  'Begin.cross_file.fetch','End.cross_file.fetch','focus set',
 ]);
 const routineWarnings=new Set(['VM.prerun','VM.postrun Begin','VM.postrun End','======= IFRAME =========','TODO: user defined canvas']);
 function isRoutine(level,args){
  const [message,detail]=args;
  // These are caught capability probes, with fallbacks, in upstream onload().
  // Other SecurityErrors and all unhandled errors must remain visible.
  if((level==='warn'||level==='error')&&message==='FIXME:'&&detail?.name==='SecurityError'){
   return /Failed to read a named property '(hash|blanker)' from '(Location|Window)': Blocked a frame/.test(detail.message);
  }
  // Optional BrowserFS is unused; this runner writes to Emscripten's own FS.
  if(level==='error'&&message==='PyMain: BrowserFS not found'&&args.length===1)return true;
  if(level==='info'&&message==='[sixel image]'&&args.length===1)return true;
  if(level==='warn')return routineWarnings.has(message)
   ||(message==='Connection:'&&['Wired','Cellular','2G'].includes(detail))
   ||(message==='NO ume unlocker, safari =='&&typeof detail==='boolean')
   ||(typeof message==='string'&&/^== FLAGS : is_mobile\((true|false)\) dev=(true|false) debug_user=(true|false) debug_mobile=(true|false) ==$/.test(message.trim()))
   ||(message==='Loading python interpreter from'&&detail===window.config?.executable);
  if(level!=='log')return false;
  if(routineLogs.has(message))return true;
  if(message==='cross_file.fetch')return Number.isInteger(detail)&&detail>=200&&detail<300;
  if(message==='Location of')return detail==='pythons.js'&&args[2]==='overrides script';
  if(typeof message==='string'&&message.trim()==='main.js:')return typeof detail==='string'&&/^locate(Data|File): /.test(detail);
  if(typeof message!=='string')return false;
  if(/^config\.[a-zA-Z0-9_]+ =$/.test(message)&&args.length===2)return true;
  // Only the exact current config dump, never arbitrary JSON or student text.
  return message.startsWith('{"cdn":')&&message===JSON.stringify(window.config);
 }
 for(const level of ['log','info','debug','warn','error']){
  const original=console[level].bind(console);
  console[level]=(...args)=>{
   // Logging must still work if a future runtime changes the config shape.
   if(!diagnostics){try{if(isRoutine(level,args))return;}catch{/* Forward unrecognized data. */}}
   original(...args);
  };
 }
})();

 const kept=[];let size=0;

window.studioFetchEncoded=async encoded=>{
 const decode=text=>new TextDecoder().decode(Uint8Array.from(atob(text),c=>c.charCodeAt(0)));
 const encode=bytes=>{let text='';for(let offset=0;offset<bytes.length;offset+=0x8000)text+=String.fromCharCode(...bytes.subarray(offset,offset+0x8000));return btoa(text);};
 const reply=value=>encode(new TextEncoder().encode(JSON.stringify(value)));
 let request;
 try{request=JSON.parse(decode(String(encoded)));}catch{return reply({error:'요청 데이터를 읽지 못했습니다.',kind:'connection'});}
 const timeout=Math.max(0.1,Math.min(30,Number(request.timeout)||10))*1000;
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort('timeout'),timeout);
 try{
  const response=await fetch(String(request.url),{
   method:String(request.method||'GET'),headers:request.headers||{},
   body:['GET','HEAD'].includes(String(request.method||'GET').toUpperCase())?undefined:Uint8Array.from(atob(request.body||''),c=>c.charCodeAt(0)),
   redirect:request.allowRedirects===false?'manual':'follow',credentials:'omit',referrerPolicy:'no-referrer',signal:controller.signal,
  });
  const bytes=new Uint8Array(await response.arrayBuffer());
  if(bytes.length>2*1024*1024)return reply({error:'응답이 Code Studio 제한(2 MB)을 넘었습니다.',kind:'connection'});
  return reply({status:response.status,url:response.url,reason:response.statusText,headers:Object.fromEntries(response.headers.entries()),body:encode(bytes)});
 }catch(error){
  const timedOut=controller.signal.aborted;
  return reply({error:timedOut?'요청 시간이 초과되었습니다.':'네트워크 요청에 실패했습니다. 주소와 서버의 CORS 허용 여부를 확인해 주세요.',kind:timedOut?'timeout':'connection'});
 }finally{clearTimeout(timer);}
};
window.studioFetches=new Map();

 const pending={result:''};window.studioFetches.set(id,pending);

(()=>{
let port=null,sessionId=null,sent=0,windowStart=performance.now();
window.studioEmit=(type,text='',runId=window.studioActiveRun)=>{
 if(!port)return;
 if(performance.now()-windowStart>1000){sent=0;windowStart=performance.now();}
 if((type==='STDOUT'||type==='STDERR')&&++sent>100)return;
 port.postMessage({protocolVersion:2,sessionId,runId,type,text:String(text).slice(0,type==='CELL_RESULT'?4000000:type==='DISPLAY'?100000:type==='FILE_WRITE'?280000:type==='INPUT_REQUEST'?60000:8192)});
 if(type==='READY'||type==='ENGINE_READY')document.getElementById('start').hidden=true;
 if(type==='ERROR'||type==='EXIT'||type==='STOPPED'){document.getElementById('start').hidden=true;document.getElementById('audio-note').hidden=true;}
};

 clearInterval(hello);port=event.ports[0];sessionId=event.data.sessionId;

 if(data.sessionId!==sessionId||data.protocolVersion!==2)return;

 if(data.type==='PRESENTATION_DISCONNECT'){window.studioDisconnectPresentation?.();return;}
 if(data.type==='INPUT_RESPONSE'){
  const pending=window.studioPendingInput;
  if(pending&&data.runId===window.studioActiveRun&&data.runId===pending.runId&&data.requestId===pending.requestId&&!pending.response&&typeof data.value==='string'&&data.value.length<=8192){
   pending.response=JSON.stringify({value:data.value}).replace(/[\u007f-\uffff]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));

 window.studioCommand=JSON.stringify(data).replace(/[\u007f-\uffff]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
 };
 port.start();window.studioEmit('CONNECTED');if(window.studioEngineReady)window.studioEmit('ENGINE_READY');
});

const audioContexts=new Set();
window.studioResetPresentation=(preserveTurtle=false)=>{
 window.studioActiveRun=null;window.studioVisualRun=null;
 window.studioPendingInput=null;
 window.studioTurtleReset(preserveTurtle);

 document.getElementById('canvas').width=document.getElementById('canvas').width;
 for(const context of audioContexts)context.studioSoundRequested=false;

function updateAudioNote(){

<script type="module" id="site" data-python="python3.12" data-os="snd,gui" src="https://pygame-web.github.io/archives/0.9/pythons.js">
import asyncio
import platform
import sys
import os
import json
import base64
import traceback
import time
import ast
import shutil
import importlib
import types
import gc
import warnings
import builtins

ROOT = '/tmp/studio'
ORIGINAL_INPUT = builtins.input
ORIGINAL_RUN = asyncio.run
ORIGINAL_STDOUT, ORIGINAL_STDERR = sys.stdout, sys.stderr
ORIGINAL_PATH = list(sys.path)
ORIGINAL_MAIN = sys.modules.get('__main__')
ORIGINAL_ARGV = list(sys.argv)
ORIGINAL_ENV = dict(os.environ)
ORIGINAL_DONT_WRITE = sys.dont_write_bytecode
active = None
prepared_packages = set()
TURTLE_SOURCE = __STUDIO_TURTLE_SOURCE__
TK_SOURCE = __STUDIO_TK_SOURCE__
PANDAS_SOURCE = __STUDIO_PANDAS_SOURCE__
PLOT_SOURCE = __STUDIO_PLOT_SOURCE__
PLOT_FONT = __STUDIO_PLOT_FONT__
STUDIO_FONTS_SOURCE = __STUDIO_FONTS_SOURCE__
REQUESTS_SOURCE = __STUDIO_REQUESTS_SOURCE__
plot_session = None
numpy_defaults = None
pygame_surface_originals = {}
ORIGINAL_WARNING_FILTERS = list(warnings.filters)

def install_studio_turtle():
    module = types.ModuleType('turtle')
    module.__file__ = '/studio/turtle.py'
    module.__dict__['_bridge'] = platform.window
    exec(compile(TURTLE_SOURCE, module.__file__, 'exec'), module.__dict__)
    package = types.ModuleType('ColabTurtlePlus')
    package.__path__ = []
    package.Turtle = module
    sys.modules['turtle'] = module
    sys.modules['ColabTurtlePlus'] = package
    sys.modules['ColabTurtlePlus.Turtle'] = module

def install_studio_tk():
    for name, source in [('tkinter', TK_SOURCE), ('pandas', PANDAS_SOURCE)]:
        module = types.ModuleType(name)
        module.__file__ = '/studio/' + name + '.py'
        module.__dict__['_bridge'] = platform.window
        module.__dict__['_save_csv'] = lambda path, data: emit('FILE_WRITE', json.dumps({'path': path, 'data': base64.b64encode(data).decode('ascii')}), active['id'])
        exec(compile(source, module.__file__, 'exec'), module.__dict__)
        sys.modules[name] = module

def install_studio_requests():
    module = types.ModuleType('requests')
    module.__file__ = '/studio/requests.py'
    module.__dict__['_bridge'] = platform.window
    exec(compile(REQUESTS_SOURCE, module.__file__, 'exec'), module.__dict__)
    exceptions = types.ModuleType('requests.exceptions')
    for name in ('RequestException', 'HTTPError', 'ConnectionError', 'Timeout', 'TooManyRedirects'):
        setattr(exceptions, name, getattr(module, name))
    module.exceptions = exceptions
    sys.modules['requests'] = module
    sys.modules['requests.exceptions'] = exceptions

def emit(kind, text='', run_id=None):
    platform.window.studioEmitEncoded(kind, base64.b64encode(str(text).encode('utf-8')).decode('ascii'), run_id)

def report(error, run_id):
    if not isinstance(error, (SystemExit, asyncio.CancelledError)):
        emit('ERROR', format_studio_exception(error), run_id)

class StudioOutput:
    def __init__(self, kind, run_id): self.kind, self.run_id = kind, run_id
    def write(self, text):
        if text: emit(self.kind, str(text), self.run_id)
        return len(text)
    def flush(self): pass
    def isatty(self): return False

def unsupported_input(prompt='', /):
    # Pygbag's default input returns a coroutine to synchronous Python callers.
    # Keep unsupported callback/dynamic contexts explicit instead of leaking it.
    raise RuntimeError('이 위치의 input()은 아직 지원하지 않습니다. 입력을 파일의 본문이나 직접 호출하는 함수로 옮겨 주세요.')

async def studio_input(prompt='', /):
    context = active
    async with context['input_lock']:
        context['input_number'] += 1
        request_id = str(context['input_number'])
        run_id = context['id']
        prompt = str(prompt)
        emit('STDOUT', prompt, run_id)
        platform.window.studioBeginInput(run_id, request_id, base64.b64encode(prompt.encode('utf-8')).decode('ascii'))
        try:
            while True:
                response = str(platform.window.studioTakeInput(run_id, request_id))
                if response:
                    value = json.loads(response)['value']
                    emit('STDOUT', value + '\n', run_id)
                    return value
                await asyncio.sleep(.01)
        finally:
            platform.window.studioEndInput(run_id, request_id)

def project_packages(project):
    packages = set()
    supported = {'pygame', 'numpy', 'matplotlib', 'requests'}
    for item in project['files']:
        if not item['path'].lower().endswith(('.py', '.ipynb')): continue
        try:
            source = base64.b64decode(item['data']).decode('utf-8')
            sources = [''.join(cell['source']) for cell in json.loads(source)['cells'] if cell['cell_type'] == 'code'] if item['path'].lower().endswith('.ipynb') else [source]
        except (UnicodeError, ValueError, KeyError, TypeError): continue
        # An unfinished later cell must not prevent imports in the current cell.
        for source in sources:
            try:
                source = '\n'.join('' if line.strip() == '!pip install ColabTurtlePlus' else line for line in source.splitlines())
                tree = ast.parse(source)
            except SyntaxError: continue
            for node in ast.walk(tree):
                if isinstance(node, ast.Import): packages.update(alias.name.split('.')[0] for alias in node.names)
                elif isinstance(node, ast.ImportFrom): packages.add((node.module or '').split('.')[0])
                elif isinstance(node, ast.Call) and node.args and isinstance(node.args[0], ast.Constant) and isinstance(node.args[0].value, str):
                    if (isinstance(node.func, ast.Name) and node.func.id == '__import__') or (isinstance(node.func, ast.Attribute) and node.func.attr == 'import_module'):
                        packages.add(node.args[0].value.split('.')[0])
    packages &= supported
    if 'matplotlib' in packages:
        packages.update(('numpy', 'PIL', 'cycler', 'dateutil', 'fontTools', 'kiwisolver', 'packaging', 'pyparsing', 'six'))
    return packages

class FrameCallFinder(ast.NodeVisitor):
    def __init__(self, call_paths): self.call_paths, self.found = call_paths, False
    def visit_FunctionDef(self, node): pass
    def visit_AsyncFunctionDef(self, node): pass
    def visit_ClassDef(self, node): pass
    def visit_Lambda(self, node): pass
    def visit_Call(self, node):
        parts, value = [], node.func
        while isinstance(value, ast.Attribute):
            parts.insert(0, value.attr); value = value.value
        if isinstance(value, ast.Name):
            parts.insert(0, value.id)
            if tuple(parts) in self.call_paths: self.found = True
        self.generic_visit(node)

class GameCallGraph:
    """Resolve direct calls within this file; never infer a method by name alone."""
    def __init__(self, tree, call_paths, notebook=False, external=()):
        self.functions, self.targets, self.lifted = {}, {}, set()
        self.input_calls = set()
        input_scopes = {}
        classes = {n.name: n for n in tree.body if isinstance(n, ast.ClassDef)}
        for node in tree.body:
            if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                self.functions[('', node.name)] = node
            elif isinstance(node, ast.ClassDef):
                for method in node.body:
                    if isinstance(method, (ast.FunctionDef, ast.AsyncFunctionDef)):
                        self.functions[(node.name, method.name)] = method
        self.keys = {id(node): key for key, node in self.functions.items()}
        roots = {name: ('function', ('', name)) for name in external if '.' not in name}
        roots.update({name.split('.')[0]: ('external_object', name.split('.')[0]) for name in external if '.' in name})
        roots.update({name: ('class', name) for name in classes})
        roots.update({key[1]: ('function', key) for key in self.functions if not key[0]})
        scopes = [(None, tree)] + list(self.functions.items())
        blocked, calls, seeds = set(), {}, set()
        def nodes(body):
            for node in body:
                yield node
                if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef, ast.Lambda, ast.ListComp, ast.SetComp, ast.DictComp, ast.GeneratorExp)):
                    yield from nodes(ast.iter_child_nodes(node))
        def bindings(body, base):
            env, writes = dict(base), {}
            for n in nodes(body):
                if isinstance(n, ast.Name) and isinstance(n.ctx, ast.Store): writes.setdefault(n.id, []).append(None)
                if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)): env[n.name] = None
                if isinstance(n, (ast.Import, ast.ImportFrom)):
                    for alias in n.names:
                        if alias.name != '*':
                            bound = alias.asname or alias.name.split('.')[0]
                            if bound not in roots: env[bound] = None
            for n in nodes(body):
                if isinstance(n, ast.Assign) and isinstance(n.value, ast.Call) and isinstance(n.value.func, ast.Name) and n.value.func.id in classes:
                    for target in n.targets:
                        if isinstance(target, ast.Name):
                            # Only one unambiguous assignment; reassigned receivers are not guessed.
                            if len(writes.get(target.id, [])) == 1: writes[target.id] = [('instance', n.value.func.id)]
            env.update({name: values[0] if len(values) == 1 else None for name, values in writes.items()})
            return env
        globals_ = bindings(tree.body, roots)
        # Definitions are bindings at module scope, too.
        globals_.update(roots)
        def target(n, env):
            if isinstance(n, ast.Name):
                value = env.get(n.id)
                return value[1] if value and value[0] == 'function' else None
            if isinstance(n, ast.Attribute) and isinstance(n.value, ast.Name):
                value = env.get(n.value.id)
                if value and value[0] == 'external_object' and n.value.id + '.' + n.attr in external:
                    return ('@', n.value.id + '.' + n.attr)
                key = (value[1], n.attr) if value and value[0] in ('class', 'instance') else None
                return key if key in self.functions else None
            return None
        for key, scope in scopes:
            env = dict(globals_)
            if key:
                for arg in scope.args.posonlyargs + scope.args.args + scope.args.kwonlyargs: env[arg.arg] = None
                for arg in (scope.args.vararg, scope.args.kwarg):
                    if arg: env[arg.arg] = None
                if key[0] and scope.args.args: env[scope.args.args[0].arg] = ('instance', key[0])
                env = bindings(scope.body, env)
                if scope.decorator_list or scope.name.startswith('__') or (key[0] and classes[key[0]].bases): blocked.add(key)
            calls[key] = set()
            for n in nodes(scope.body):
                if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef, ast.Lambda, ast.ListComp, ast.SetComp, ast.DictComp, ast.GeneratorExp)):
                    if id(n) in self.keys or (key is None and isinstance(n, ast.ClassDef)):
                        continue  # Collected definitions are analyzed in their own scope.
                    # Callbacks, nested scopes and comprehension awaits need richer analysis.
                    for inner in ast.walk(n):
                        found = target(inner, env)
                        if found: blocked.add(found)
                    continue
                if isinstance(n, (ast.Yield, ast.YieldFrom)) and key: blocked.add(key)
                if isinstance(n, ast.Call):
                    if isinstance(n.func, ast.Name) and n.func.id == 'input' and 'input' not in env:
                        input_scopes[id(n)] = key
                        if key: seeds.add(key)
                    found = target(n.func, env)
                    if found:
                        self.targets[id(n)] = found
                        calls[key].add(found)
                # A function/method used as a value may be invoked by synchronous library code.
                for child in ast.iter_child_nodes(n):
                    if isinstance(n, ast.Call) and child is n.func: continue
                    found = target(child, env)
                    if found: blocked.add(found)
                if key and isinstance(n, (ast.While, ast.For)):
                    finder = FrameCallFinder(call_paths); finder.visit(n)
                    if finder.found: seeds.add(key)
        # If a caller cannot be lifted, preserve its synchronous callees as well.
        pending = list(blocked)
        while pending:
            for callee in calls.get(pending.pop(), ()):
                if callee not in blocked: blocked.add(callee); pending.append(callee)
        reachable, pending = set(), list(calls[None])
        while pending:
            key = pending.pop()
            if key in reachable: continue
            reachable.add(key); pending.extend(calls.get(key, ()))
        if notebook: reachable.update(self.functions)
        external_keys = {('@' if '.' in name else '', name) for name in external} - set(self.functions)
        eligible = {key for key, node in self.functions.items() if isinstance(node, ast.FunctionDef)} & reachable - blocked
        seeds.update(key for key in eligible if calls[key] & external_keys)
        self.lifted = seeds & eligible
        while True:
            extra = {key for key in eligible if calls[key] & self.lifted} - self.lifted
            if not extra: break
            self.lifted.update(extra)
        self.await_calls = {identity for identity, key in self.targets.items() if key in self.lifted or key in external_keys}
        self.input_calls = {identity for identity, key in input_scopes.items()
                            if key is None or key in self.lifted or isinstance(self.functions[key], ast.AsyncFunctionDef)}

class BrowserGameLoops(ast.NodeTransformer):
    def __init__(self, call_paths, yield_name, graph=None, input_name=None):
        self.input_name = input_name
        self.call_paths, self.yield_name, self.changed = call_paths, yield_name, False
        self.graph, self.adapt_loops, self.in_loop = graph, True, False
    def visit_FunctionDef(self, node):
        if not self.graph or self.graph.keys.get(id(node)) not in self.graph.lifted: return node
        self.changed = True
        result = ast.AsyncFunctionDef(**{field: getattr(node, field) for field in node._fields})
        ast.copy_location(result, node)
        return self.function_body(result, True)
    def function_body(self, node, adapt):
        previous = self.adapt_loops, self.in_loop
        self.adapt_loops, self.in_loop = adapt, False
        node.body = [self.visit(statement) for statement in node.body]
        self.adapt_loops, self.in_loop = previous
        return node
    def visit_AsyncFunctionDef(self, node): return self.function_body(node, False)
    def visit_ClassDef(self, node):
        node.body = [self.visit(n) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) else n for n in node.body]
        return node
    def visit_Lambda(self, node): return node
    def visit_Call(self, node):
        is_input = self.graph and id(node) in self.graph.input_calls
        needs_await = self.graph and (id(node) in self.graph.await_calls or is_input)
        if is_input: node.func = ast.copy_location(ast.Name(id=self.input_name, ctx=ast.Load()), node.func)
        self.generic_visit(node)
        if needs_await:
            self.changed = True
            return ast.copy_location(ast.Await(value=node), node)
        return node
    def visit_Await(self, node):
        value = self.visit(node.value)
        node.value = value.value if isinstance(value, ast.Await) else value
        return node
    def visit_While(self, node):
        finder = FrameCallFinder(self.call_paths)
        finder.visit(node)
        indirect = self.graph and any(id(n) in self.graph.await_calls for n in ast.walk(node))
        adapt = self.adapt_loops and (finder.found or indirect)
        insert = adapt and (isinstance(node, ast.While) or not self.in_loop)
        previous = self.in_loop
        self.in_loop = previous or adapt
        self.generic_visit(node)
        self.in_loop = previous
        if insert:
            pause = ast.Expr(value=ast.Await(value=ast.Call(func=ast.Name(id=self.yield_name, ctx=ast.Load()), args=[], keywords=[])))
            node.body.insert(0, ast.copy_location(pause, node))
            self.changed = True
        return node
    visit_For = visit_While

def compile_project(source, filename, namespace, notebook=False):
    # Accept only the lesson's exact Colab install directive. Never run shell/pip.
    # Tokenize first so a matching line inside a multiline string stays unchanged.
    import io, re, tokenize
    string_lines = set()
    try:
        for token in tokenize.generate_tokens(io.StringIO(source).readline):
            if token.type == tokenize.STRING:
                string_lines.update(range(token.start[0], token.end[0] + 1))
    except (tokenize.TokenError, IndentationError):
        pass  # ast.parse below reports the original syntax error and line.
    source = ''.join(
        ('\n' if line.endswith('\n') else '')
        if number not in string_lines and re.fullmatch(r'[ \t]*[!%]pip[ \t]+install[ \t]+ColabTurtlePlus[ \t]*(?:#[^\n]*)?\n?', line)
        else line for number, line in enumerate(source.splitlines(keepends=True), 1))
    try:
        tree = ast.parse(source, filename='<notebook-cell>' if notebook else filename)
    except SyntaxError as error:
        # A notebook's on-disk file is JSON, not the executed cell. Some Python
        # builds look up syntax-error text by filename; retain the cell line.
        if notebook and error.lineno:
            error.filename = filename
            source_lines = source.splitlines(keepends=True)
            if error.lineno <= len(source_lines):
                error.text = source_lines[error.lineno - 1]
        raise
    # Resolve common pygame and requests imports without guessing from
    # text/comments/strings. Direct requests calls become awaits; their callers
    # are lifted through the same conservative call graph used for input().
    aliases = {}
    request_external = []
    request_methods = {'request', 'get', 'options', 'head', 'post', 'put', 'patch', 'delete'}
    if notebook:
        for name, value in namespace.items():
            if isinstance(value, types.ModuleType) and value.__name__.startswith('pygame'):
                aliases[name] = tuple(value.__name__.split('.'))
            elif isinstance(value, types.ModuleType) and value.__name__ == 'requests':
                request_external.extend(name + '.' + method for method in request_methods)
    for node in tree.body:
        if isinstance(node, ast.Import):
            for alias in node.names:
                if alias.name == 'pygame': aliases[alias.asname or 'pygame'] = ('pygame',)
                elif alias.name == 'requests':
                    name = alias.asname or 'requests'
                    request_external.extend(name + '.' + method for method in request_methods)
        elif isinstance(node, ast.ImportFrom) and node.level == 0 and (node.module or '').startswith('pygame'):
            for alias in node.names:
                if alias.name != '*': aliases[alias.asname or alias.name] = tuple(node.module.split('.')) + (alias.name,)
        elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module == 'requests':
            request_external.extend(alias.asname or alias.name for alias in node.names if alias.name in request_methods)
    frame_paths = [('pygame','display','update'), ('pygame','display','flip'), ('pygame','event','get'), ('pygame','event','poll')]
    call_paths = { (name,) + path[len(prefix):] for name, prefix in aliases.items() for path in frame_paths if path[:len(prefix)] == prefix }
    yield_name = '_metasense_frame_yield_' + str(id(namespace))
    import inspect
    external = ([name for name, value in namespace.items() if inspect.iscoroutinefunction(value)] if notebook else []) + request_external
    if notebook:
        for name, value in list(namespace.items()):
            cls = value if inspect.isclass(value) else type(value)
            if getattr(cls, '__module__', '') == '__main__':
                external.extend(name + '.' + method for method, _ in inspect.getmembers(cls, inspect.iscoroutinefunction))
    graph = GameCallGraph(tree, call_paths, notebook, external)
    input_name = '_metasense_input_' + str(id(namespace))
    if graph.input_calls: namespace[input_name] = studio_input
    transformer = BrowserGameLoops(call_paths, yield_name, graph, input_name)
    tree = transformer.visit(tree)
    if transformer.changed:
        namespace[yield_name] = lambda: asyncio.sleep(0)
    significant = [t for t in tokenize.generate_tokens(io.StringIO(source).readline) if t.type not in (tokenize.COMMENT, tokenize.NL, tokenize.NEWLINE, tokenize.INDENT, tokenize.DEDENT, tokenize.ENDMARKER)] if notebook else []
    suppress = significant and significant[-1].string == ';'
    if notebook and tree.body and isinstance(tree.body[-1], ast.Expr) and not suppress:
        last = tree.body[-1]
        name = '_metasense_display_' + str(id(namespace))
        namespace[name] = notebook_display
        last.value = ast.copy_location(ast.Call(func=ast.Name(id=name, ctx=ast.Load()), args=[last.value], keywords=[]), last.value)
    code = compile(ast.fix_missing_locations(tree), filename, 'exec', flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)
    if notebook:
        import weakref
        if not hasattr(compile_project, 'sources'):
            compile_project.sources = weakref.WeakKeyDictionary()
        lines = source.splitlines(keepends=True)
        def remember(item):
            compile_project.sources[item] = lines
            for constant in item.co_consts:
                if isinstance(constant, types.CodeType): remember(constant)
        remember(code)
    return code

def format_studio_exception(error):
    # ipynb files contain JSON. Keep the source for each executed code object,
    # including functions from earlier cells, without replacing the saved file.
    import traceback
    rendered = traceback.TracebackException.from_exception(error)
    sources = getattr(compile_project, 'sources', {})
    seen = set()
    def restore(exc, display):
        if exc is None or display is None or id(exc) in seen: return
        seen.add(id(exc))
        tb = exc.__traceback__
        for index, frame in enumerate(display.stack):
            if tb is None: break
            lines = sources.get(tb.tb_frame.f_code)
            if lines is not None and 0 < tb.tb_lineno <= len(lines):
                display.stack[index] = traceback.FrameSummary(
                    frame.filename, frame.lineno, frame.name, lookup_line=False,
                    line=lines[tb.tb_lineno - 1], end_lineno=frame.end_lineno,
                    colno=frame.colno, end_colno=frame.end_colno)
            tb = tb.tb_next
        restore(exc.__cause__, display.__cause__)
        restore(exc.__context__, display.__context__)
        for child, detail in zip(getattr(exc, 'exceptions', ()), display.exceptions or ()):
            restore(child, detail)
    restore(error, rendered)
    return ''.join(rendered.format())

def cancel_user_callbacks(loop):
    for queue_name in ('_scheduled', '_ready'):
        for handle in list(getattr(loop, queue_name, ())):
            callback = getattr(handle, '_callback', None)
            code = getattr(callback, '__code__', None)
            if code and code.co_filename.startswith(ROOT + '/'):
                handle.cancel()

async def stop_current(preserve_turtle=False):
    global active, plot_session
    if active is None:
        if not preserve_turtle: platform.window.studioResetPresentation()
        return True
    context = active
    context['deadline'] = time.monotonic() + .5
    sys.settrace(context['trace'])
    # Include tasks spawned by student helpers, not only asyncio.run(main()).
    pending = {task for task in asyncio.all_tasks() if task not in context['baseline_tasks'] and task is not asyncio.current_task()}
    for task in pending: task.cancel()
    if pending:
        _, unfinished = await asyncio.wait(pending, timeout=.25)
        if unfinished:
            emit('RESET_REQUIRED', '실행 작업을 정리하고 있습니다.', context['id'])
            return False
    sys.settrace(None)
    cancel_user_callbacks(asyncio.get_running_loop())
    if plot_session:
        try:
            if preserve_turtle: plot_session[0]()
        except Exception as error:
            report(error, context['id'])
        finally:
            plot_session[1]()
            plot_session = None
    pygame = sys.modules.get('pygame')
    if pygame is not None:
        for name, original in pygame_surface_originals.items(): setattr(pygame.display, name, original)
        pygame_surface_originals.clear()
        pygame.quit()
    if numpy_defaults:
        numpy = sys.modules.get('numpy')
        numpy.seterr(**numpy_defaults[0])
        numpy.set_printoptions(**numpy_defaults[1])
    warnings.filters[:] = ORIGINAL_WARNING_FILTERS
    asyncio.run = ORIGINAL_RUN
    builtins.input = ORIGINAL_INPUT
    sys.stdout, sys.stderr = ORIGINAL_STDOUT, ORIGINAL_STDERR
    sys.path[:] = ORIGINAL_PATH
    sys.argv[:] = ORIGINAL_ARGV
    sys.modules['__main__'] = ORIGINAL_MAIN
    for name in ('turtle', 'ColabTurtlePlus.Turtle', 'ColabTurtlePlus', 'tkinter', 'pandas', 'requests.exceptions', 'requests'):
        sys.modules.pop(name, None)
    sys.dont_write_bytecode = ORIGINAL_DONT_WRITE
    os.environ.clear(); os.environ.update(ORIGINAL_ENV)
    # Drop project imports even when the same path/mtime is reused on the next run.
    for name, module in list(sys.modules.items()):
        filename = str(getattr(module, '__file__', '') or '')
        if filename.startswith(ROOT + '/'):
            sys.modules.pop(name, None)
    for path in list(sys.path_importer_cache):
        if str(path).startswith(ROOT): sys.path_importer_cache.pop(path, None)
    importlib.invalidate_caches()
    os.chdir('/tmp')
    if os.path.exists(ROOT): shutil.rmtree(ROOT)
    context['namespace'].clear()
    active = None
    platform.window.studioResetPresentation(preserve_turtle)
    gc.collect()
    return True

def notebook_display(value):
    if value is None or isinstance(value, asyncio.Future): return
    active['namespace']['_'] = value
    pandas = sys.modules.get('pandas')
    if pandas and isinstance(value, pandas.DataFrame):
        small = value.head(50)
        columns = list(small.columns)[:20]
        result = {'kind': 'table', 'columns': [str(c)[:200] for c in columns],
                  'rows': [[str(i)[:200]] + [str(row.get(c, ''))[:80] for c in columns]
                           for i, row in zip(small.index, small.to_dict('records'))],
                  'summary': str(value.shape) + (' · 일부 표시' if len(value) > 50 or len(value.columns) > 20 else '')}
    else:
        result = {'kind': 'text', 'text': repr(value)[:16000]}
    emit('DISPLAY', json.dumps(result, ensure_ascii=False), active['id'])

async def start_project(command):
    global active, plot_session, numpy_defaults
    run_id, project = command['runId'], command['project']
    cell = command.get('notebook')
    continuing = bool(cell and active and active.get('kernel') == cell['kernel'] and active.get('idle'))
    os.makedirs(ROOT, exist_ok=True)
    previous_files = active.get('files', {}) if continuing else {}
    incoming = {item['path']: item['data'] for item in project['files']}
    for path in previous_files.keys() - incoming.keys():
        full = ROOT + '/' + path
        if os.path.isfile(full): os.remove(full)
    for folder in project.get('folders', []):
        if folder.startswith('/') or '\\' in folder or any(p in ('', '.', '..') for p in folder.split('/')):
            raise ValueError('Invalid project folder')
        os.makedirs(ROOT + '/' + folder, exist_ok=True)
    for path, data in incoming.items():
        if path.startswith('/') or '\\' in path or any(p in ('', '.', '..') for p in path.split('/')):
            raise ValueError('Invalid project path')
        if previous_files.get(path) == data: continue
        full = ROOT + '/' + path
        os.makedirs(os.path.dirname(full), exist_ok=True)
        with open(full, 'wb') as output: output.write(base64.b64decode(data))
    packages = project_packages(project)
    for package in sorted(packages - prepared_packages - {'requests'}):
        await shell.preload_code('import ' + package, loaderhome='/tmp')
        prepared_packages.add(package)
    if 'requests' in packages and 'requests' not in sys.modules:
        install_studio_requests()
    if platform.window.studioCommand:
        if not continuing:
            os.chdir('/tmp')
            shutil.rmtree(ROOT)
        return
    os.chdir(ROOT)
    sys.path[:] = [ROOT] + ORIGINAL_PATH
    sys.dont_write_bytecode = True
    source_path = ROOT + '/' + project['entrypoint']
    sys.argv[:] = [source_path]
    if continuing:
        context = active
        namespace = context['namespace']
        context.update(id=run_id, tasks=[], failed=False, idle=False, files=incoming)
    else:
        module = types.ModuleType('__main__')
        module.__file__ = source_path
        sys.modules['__main__'] = module
        namespace = module.__dict__
        install_studio_turtle()
        install_studio_tk()
        context = {'id': run_id, 'namespace': namespace, 'baseline_tasks': set(asyncio.all_tasks()), 'tasks': [], 'deadline': time.monotonic() + 2, 'failed': False, 'input_lock': asyncio.Lock(), 'input_number': 0, 'kernel': cell['kernel'] if cell else None, 'idle': False, 'count': 0, 'files': incoming}
        active = context
        if cell: namespace['display'] = notebook_display
        if cell: emit('KERNEL_RESET', run_id=run_id)
    builtins.input = unsupported_input
    platform.window.studioActiveRun = run_id
    sys.stdout, sys.stderr = StudioOutput('STDOUT', run_id), StudioOutput('STDERR', run_id)
    if 'pygame' in packages:
        import pygame
        import pygame.sysfont as pygame_sysfont
        studio_fonts = types.ModuleType('studio_fonts')
        exec(compile(STUDIO_FONTS_SOURCE, '/studio/studio_fonts.py', 'exec'), studio_fonts.__dict__)
        studio_fonts.install(pygame_sysfont, PLOT_FONT)
    def trace(frame, event, arg):
        # Browser scheduling pauses (e.g. focusing the separate display) are not
        # student CPU time. A task resumed by asyncio gets a fresh slice; an
        # uninterrupted student loop still hits the same two-second limit.
        if event == 'call' and frame.f_code.co_filename.startswith(ROOT + '/') and frame.f_back and not frame.f_back.f_code.co_filename.startswith(ROOT + '/'):
            context['deadline'] = time.monotonic() + 2
        if event == 'line' and frame.f_code.co_filename.startswith(ROOT + '/') and time.monotonic() > context['deadline']:
            raise RuntimeError('반복문이 화면을 멈췄습니다. 게임 루프에 await asyncio.sleep(0)을 넣어 주세요.')
        return trace
    context['trace'] = trace
    if 'numpy' in packages and numpy_defaults is None:
        import numpy
        numpy_defaults = (numpy.geterr(), numpy.get_printoptions())
    if 'numpy' in packages and not continuing:
        import numpy
        numpy.seterr(divide='warn', over='warn', under='ignore', invalid='warn')
        numpy.random.seed(None)
        warnings.simplefilter('default', RuntimeWarning)
    if 'matplotlib' in packages and plot_session is None:
        plot_module = types.ModuleType('studio_plot')
        exec(compile(PLOT_SOURCE, '/studio/studio_plot.py', 'exec'), plot_module.__dict__)
        plot_session = plot_module.install(platform.window, ROOT, PLOT_FONT)
    if 'pygame' in packages and not pygame_surface_originals:
        import pygame
        def surface_call(original):
            def call(*args, **kwargs):
                platform.window.studioShowSurface('canvas')
                return original(*args, **kwargs)
            return call
        for name in ('set_mode', 'flip', 'update'):
            pygame_surface_originals[name] = getattr(pygame.display, name)
            setattr(pygame.display, name, surface_call(pygame_surface_originals[name]))
    context['deadline'] = time.monotonic() + 2
    async def watch(coroutine):
        try:
            await coroutine
        except BaseException as error:
            if not isinstance(error, (SystemExit, asyncio.CancelledError)):
                context['failed'] = True
                report(error, run_id)
    def game_run(coroutine, *args, **kwargs):
        task = asyncio.create_task(watch(coroutine))
        context['tasks'].append(task)
        return task
    asyncio.run = game_run
    emit('READY', run_id=run_id)
    emit('RUNNING', run_id=run_id)
    if cell:
        context['count'] += 1
        emit('CELL_START', str(context['count']), run_id)
    sys.settrace(trace)
    try:
        if cell:
            source = '\n' * max(0, min(100000, int(cell.get('line', 1))) - 1) + cell['source']
        else:
            with open(source_path, encoding='utf-8') as file: source = file.read()
        result = eval(compile_project(source, source_path, namespace, notebook=bool(cell)), namespace)
        if asyncio.iscoroutine(result): game_run(result)
    except BaseException as error:
        context['failed'] = True
        sys.settrace(None)
        report(error, run_id)

async def studio_boot():
    global active
    platform.window.studioEngineReady = True
    emit('ENGINE_READY')
    while True:
        raw = str(platform.window.studioTakeCommand())
        if raw:
            command = json.loads(raw)
            try:
                resume = command['type'] == 'RUN' and command.get('notebook') and active and active.get('idle') and active.get('kernel') == command['notebook'].get('kernel')
                if not resume and not await stop_current(): return
                if command['type'] == 'RUN':
                    await start_project(command)
                else:
                    emit('STOPPED', run_id=command['runId'])
            except BaseException as error:
                sys.settrace(None)
                report(error, command['runId'])
                if not await stop_current(): return
        if active:
            active['deadline'] = time.monotonic() + 2
            tk = sys.modules.get('tkinter')
            try:
                if tk and not active['failed']:
                    sys.settrace(active['trace'])
                    tk._pump()
            except BaseException as error:
                sys.settrace(None)
                active['failed'] = True
                report(error, active['id'])
            if not active.get('idle') and (active['failed'] or (all(task.done() for task in active['tasks']) and not platform.window.studioTurtleBusy() and (active.get('kernel') or not (tk and tk._busy())))):
                run_id = active['id']
                sys.settrace(None)
                if active.get('kernel'):
                    if plot_session:
                        try: plot_session[0]()
                        except Exception as error:
                            active['failed'] = True
                            report(error, run_id)
                    emit('CELL_RESULT', str(platform.window.studioNotebookSnapshot(bool(sys.modules.get('pygame') and sys.modules['pygame'].display.get_surface()))), run_id)
                    active['idle'] = True
                else:
                    if not await stop_current(preserve_turtle=not active['failed']): return
                emit('EXIT', run_id=run_id)
        await asyncio.sleep(.01)
