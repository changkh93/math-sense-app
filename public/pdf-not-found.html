<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF를 불러오지 못했습니다</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050a19; color: #dffcff; }
      main { width: min(32rem, calc(100% - 3rem)); padding: 2rem; box-sizing: border-box; text-align: center; border: 1px solid #00f3ff66; border-radius: 1rem; background: #0a1226; }
      h1 { margin: 0 0 0.8rem; color: #00f3ff; font-size: 1.25rem; }
      p { margin: 0; color: #a9bccb; line-height: 1.65; }
    </style>
  </head>
  <body>
    <main>
      <h1>PDF 자료를 불러오지 못했습니다.</h1>
      <p>페이지를 다시 열어 주세요. 문제가 계속되면 선생님께 해당 DATA LOG 제목을 알려 주세요.</p>
    </main>
  </body>
</html>
