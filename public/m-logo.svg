<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Space -->
  <rect width="500" height="500" fill="transparent"/>

  <!-- Orbital 'M' Structure -->
  <g transform="translate(50, 80)" filter="url(#glow)">
    <path 
      d="M 50,300 
         C 50,150 150,50 200,100 
         C 230,130 250,250 250,280
         C 250,250 270,130 300,100
         C 350,50 450,150 450,300"
      fill="none" 
      stroke="url(#orbit-grad)" 
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    
    <!-- Orbit Rings / Stars Accent -->
    <ellipse cx="250" cy="180" rx="220" ry="80" fill="none" stroke="rgba(0, 243, 255, 0.3)" stroke-width="4" transform="rotate(-15 250 180)" />
    <circle cx="200" cy="100" r="10" fill="#00f3ff"/>
    <circle cx="300" cy="100" r="10" fill="#00ff88"/>
    <circle cx="50" cy="300" r="12" fill="#8b5cf6"/>
    <circle cx="450" cy="300" r="8" fill="#00f3ff"/>
    <circle cx="250" cy="280" r="14" fill="#ffffff"/>
  </g>
</svg>
