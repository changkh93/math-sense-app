<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">90도 회전을 세 번, 네 번, 다섯 번 반복한 경로</title>
  <desc id="desc">세 번은 왼쪽 변이 열린 채 끝나고, 네 번은 출발점으로 돌아오며, 다섯 번은 첫 변을 다시 지납니다.</desc>
  <rect width="960" height="430" rx="24" fill="#f2f6ef"/>
  <g font-family="sans-serif" fill="#183b37">
    <text x="38" y="55" font-size="25" font-weight="700">같은 명령, 다른 반복 횟수</text>
    <text x="38" y="84" font-size="16">앞으로 100 → 왼쪽으로 90° · 각 그림은 (0, 0)에서 별도 실행</text>
    <g transform="translate(24 108)">
      <rect width="288" height="296" rx="18" fill="#ffffff" stroke="#d6e5da"/>
      <text x="24" y="38" font-size="24" font-weight="700">3회</text>
      <text x="24" y="67" font-size="16">오른쪽 → 위 → 왼쪽</text>
      <path d="M 74 220 L 214 220 L 214 80 L 74 80" fill="none" stroke="#328781" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="74" cy="220" r="9" fill="#183b37"/>
      <circle cx="74" cy="80" r="9" fill="#e27938"/>
      <text x="96" y="274" font-size="16">끝점이 출발점과 다름</text>
    </g>
    <g transform="translate(336 108)">
      <rect width="288" height="296" rx="18" fill="#ffffff" stroke="#d6e5da"/>
      <text x="24" y="38" font-size="24" font-weight="700">4회</text>
      <text x="24" y="67" font-size="16">네 방향을 지나 닫힘</text>
      <path d="M 74 220 L 214 220 L 214 80 L 74 80 Z" fill="none" stroke="#328781" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="74" cy="220" r="9" fill="#183b37"/>
      <text x="66" y="274" font-size="16">출발점과 끝점이 같음</text>
    </g>
    <g transform="translate(648 108)">
      <rect width="288" height="296" rx="18" fill="#ffffff" stroke="#d6e5da"/>
      <text x="24" y="38" font-size="24" font-weight="700">5회</text>
      <text x="24" y="67" font-size="16">다섯 번째는 첫 변 위</text>
      <path d="M 74 220 L 214 220 L 214 80 L 74 80 L 74 220" fill="none" stroke="#328781" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 74 220 L 214 220" fill="none" stroke="#e27938" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10"/>
      <circle cx="74" cy="220" r="9" fill="#183b37"/>
      <circle cx="214" cy="220" r="9" fill="#e27938"/>
      <text x="47" y="274" font-size="16">주황색 선이 첫 변과 겹침</text>
    </g>
  </g>
</svg>
