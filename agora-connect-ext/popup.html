<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agora Connect</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <div class="header">
      <div class="logo">
        <span class="icon">🌌</span>
        <span class="title">Stellar Agora</span>
      </div>
      <div class="header-right">
        <span class="version-tag">v1.0.4</span>
        <div class="status-indicator online" title="연결 상태"></div>
      </div>
    </div>

    <div class="main-action">
      <button id="capture-btn" class="capture-btn">
        <div class="btn-icon">📸</div>
        <div class="btn-text">
          <span class="main-text">화면 캡쳐 후 질문하기</span>
          <span class="sub-text">현재 보고 있는 웹페이지를 바로 캡처하여 질문합니다</span>
        </div>
      </button>
    </div>

    <div class="content-section">
      <div id="activity-container" class="activity-container">
        <!-- Dynamic: Login prompt or User Card + Pathway to My Questions -->
      </div>
    </div>

    <div class="footer">
      <div class="powered-by">Powered by <strong>Meta Sense</strong></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
